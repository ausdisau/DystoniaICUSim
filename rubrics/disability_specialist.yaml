id: disability_specialist
name: Disability Specialist Competencies
pass_threshold: 0.7
bands:
  excellent: 0.9
  proficient: 0.7
  developing: 0.5
dimensions:
  - id: functional_assessment
    name: Functional assessment and documentation
    weight: 1.2
    description: Baseline function, communication method, mobility, and care needs documented.
  - id: accommodation_planning
    name: Accommodation planning
    weight: 1.2
    description: Communication access, positioning, sensory and environmental supports.
  - id: interprofessional_coordination
    name: Interprofessional coordination
    weight: 1.0
    description: Timely consults with PM&R, neurology, speech, and nursing alignment.
  - id: patient_centered_communication
    name: Patient and caregiver-centered communication
    weight: 1.0
    description: Shared decision-making and staged family updates during crisis.
  - id: safety_escalation
    name: Safety and escalation appropriateness
    weight: 1.3
    description: Airway, metabolic, and neurological escalation without inappropriate limits of care.
