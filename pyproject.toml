[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dystonia-icu-sim"
version = "0.1.0"
description = "Disability specialist medical simulation framework for acute dystonia ICU training"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dystonia-sim = "dystonia_icu_sim.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dystonia_icu_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
